organization: Mineo Games
description: 'Welcome to the official Mineo Games website. VR Indie Studio.'
keywords: Mineo Games, Mineo, mineo games, mineogames, Dung Beetle, dung beetle, nest guard, shark hunt, gamejolt, VR, Virtual reality, Réalité virtuelle, RV, indie studio, video games studio, studio, jeux vidéo, video games, immersion, studio, steam, oculus, HTC vive, WMR, Windows Mixed Reality, Valve index, Rift, Rfit S, Quest, HP Reverb, future, gaming, 

