  fr: '/accueil'

pages_list:
  en:
    link: '/index'
    pages:
      Our games: 'games'
      Our products: 'products'
      Blog: 'last-blog-post'
      About: 'about'
      Contact: 'contact'
  fr:
    link: '/accueil'
    pages:
      Nos jeux: 'games'
      Nos produits: 'products'
      Blog: 'last-blog-post'
      A propos: 'about'
      Contact: 'contact'

games:
  - name: Vermin Exterminator
