    page:
      en: '/games/shark-hunt/'
      fr: '/games/shark-hunt-fr/'
      
products:
  - name: Tiny GameDev Organizer
    slug: tgo
    img: products/tgo-home-banner-v2.webp
    img_width: 2172
    img_height: 724
    eyebrow:
      en: Focused Notion workspace
      fr: Workspace Notion essentiel
    description:
      en: Plan and track your indie game in one place.
      fr: Planifiez et suivez votre jeu indépendant au même endroit.
    cta:
      en: Explore TGO
      fr: Découvrir TGO
    page:
      en: '/products/tgo/'
      fr: '/products/tgo-fr/'
  - name: Ultimate GameDev Organizer
    slug: ugo
    img: products/ugo-home-banner-v2.webp
    img_width: 2172
    img_height: 724
    eyebrow:
      en: Complete production system
      fr: Système de production complet
    description:
      en: Scale ambitious game projects with a complete command center.
      fr: Pilotez vos projets ambitieux depuis un centre de contrôle complet.
    cta:
      en: Discover UGO
      fr: Découvrir UGO
    page:
      en: 'https://www.notion.com/templates/ultimate-gamedev-organizer'
      fr: 'https://www.notion.com/templates/ultimate-gamedev-organizer'

last_post_words: 100

# Cache-busting suffix on style.css and images. Bump this one value on every
# CSS or asset change, otherwise visitors keep the previous file forever.
defaults:
  - scope:
      path: ""
    values:
      asset_version: 20260806-3

# Adobe Fonts kit id serving Good Pro (headings and display). Leave empty and the
# font stacks fall back to Montserrat and Staatliches.
adobe_fonts_kit: "fnq2lgu"

# Build settings
markdown: kramdown
permalink: pretty

gems:
  - jekyll-sitemap

exclude:
  - AGENTS.md
  - CLAUDE.md
  - data_analysis.ipynb
  - img/Adobe Premiere Pro Auto-Save
  - img/GifSizeMaker_1.prproj
  - src
