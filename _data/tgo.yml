  faq_title: FAQ
  faq_intro: Les questions les plus fréquentes sur l'utilisation de TGO dans vos projets de jeu.
  faq:
    - question: Qu'est-ce que TGO ?
      answer: TGO est un dashboard Notion complet conçu pour les développeurs de jeux indépendants. Il réunit la planification, les tâches, les notes et le suivi de projet dans un seul espace de travail, pour passer moins de temps à gérer des outils et plus de temps à créer votre jeu.
    - question: Combien coûte TGO ?
      answer: TGO coûte 11 $ en paiement unique. Le dashboard complet et l'accès à vie sont inclus, sans abonnement.
    - question: Comment démarrer ?
      answer: Achetez TGO, puis dupliquez le template dans votre espace Notion. Suivez les premières étapes guidées dans le dashboard pour ajouter votre game design document et créer votre première tâche.
    - question: Puis-je utiliser TGO avec le plan gratuit de Notion ?
      answer: Oui. TGO est un template payant, mais il fonctionne avec le plan gratuit de Notion. Seules les automatisations natives de Notion peuvent nécessiter un plan payant pour être configurées.
    - question: Puis-je collaborer avec d'autres personnes ?
      answer: Oui. TGO convient aux développeurs solo comme aux petites équipes. Invitez vos collaborateurs dans votre espace Notion pour partager des idées, assigner des tâches et suivre l'avancement ensemble.
