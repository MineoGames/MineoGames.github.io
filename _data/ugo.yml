  faq_title: FAQ
  faq_intro: Tout ce qu'il faut savoir avant de piloter votre production avec UGO.
  faq:
    - question: Qu'est-ce qu'UGO ?
      answer: UGO est un système d'exploitation Notion complet pour la production de jeux. Il relie le périmètre, les jalons, les sprints, les tâches, le suivi du temps, les assets, la documentation, le marketing, les ventes et la planification de sortie dans un seul espace de travail.
    - question: Quelle différence avec TGO ?
      answer: TGO est un organiseur ciblé pour les petits projets et les démarrages rapides. UGO est le système de production complet pour les projets solo ambitieux et les studios qui ont besoin de planification approfondie, de collaboration, de suivi du temps et de workflows de sortie.
    - question: 279 $ pour un template Notion, pourquoi ?
      answer: Parce qu'il remplace les deux semaines que vous passeriez à le construire et les six mois que vous passeriez à découvrir ce qui lui manquait. Paiement unique, sans abonnement, mises à jour à vie, et remboursement sous 14 jours si ce n'est pas pour vous.
    - question: UGO est-il trop lourd pour un développeur solo ?
      answer: Non. UGO a été conçu au départ par un développeur solo. Commencez par les vues dont vous avez besoin, masquez le reste, et laissez le système grandir avec votre projet.
    - question: Mon équipe peut-elle collaborer dans UGO ?
      answer: Oui. Invitez vos collaborateurs à partager la même source de vérité, attribuez les responsabilités, suivez l'avancement des sprints et gardez la documentation reliée au travail. Depuis la 1.13, vous pouvez aussi partager un seul projet, jalon, domaine ou ressource plutôt que tout l'espace.
    - question: UGO fonctionne-t-il avec le plan gratuit de Notion ?
      answer: Le cœur du système fonctionne avec le plan gratuit de Notion. Certaines automatisations natives et fonctions avancées peuvent nécessiter un plan Notion payant.
