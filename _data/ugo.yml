  faq_title: FAQs
  faq_intro: Everything you need to know before running your production with UGO.
  faq:
    - question: What is UGO?
      answer: UGO is a complete Notion operating system for game production. It connects scope, milestones, sprints, tasks, time tracking, assets, documentation, marketing, sales and release planning in one workspace.
    - question: What's the difference between UGO and TGO?
      answer: TGO is a focused organizer for smaller projects and quick starts. UGO is the full production system for ambitious solo projects and studios that need deeper planning, collaboration, time tracking, and release workflows.
    - question: $279 for a Notion template. Why?
      answer: Because it replaces the two weeks you would spend building it and the six months you would spend discovering what it was missing. One payment, no subscription, lifetime updates, and a 14-day refund if it is not for you.
    - question: Is UGO too much for a solo developer?
      answer: No. UGO was originally built by a solo developer. Start with the views you need, hide the rest, and let the system grow with your project.
    - question: Can my team collaborate in UGO?
      answer: Yes. Invite collaborators to share the same production source of truth, assign ownership, follow sprint progress, and keep documentation linked to the work. Since version 1.13 you can also share a single project, milestone, area or resource instead of the whole workspace.
    - question: Does UGO work with Notion's free plan?
      answer: The core system works with Notion's free plan. Some native Notion automations and advanced workspace capabilities may require a paid Notion plan.

