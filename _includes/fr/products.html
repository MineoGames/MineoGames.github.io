<section id="products" class="content-section text-center">
    <h1>Nos produits</h1>
    <div class="product-list">
    {% for product in site.products %}
    {% if product.page[page.lang] %}
    <a class="product-banner-link" href="{{ site.baseurl }}{{ product.page[page.lang] }}">
        {% endif %}
        <article class="product-banner product-banner--{{ product.slug }}">
            <img class="product-banner__image" src="{{ site.baseurl }}/img/{{ product.img }}{% if page.asset_version %}?v={{ page.asset_version }}{% endif %}" width="{{ product.img_width }}" height="{{ product.img_height }}" loading="lazy" decoding="async" alt="">
            <div class="product-banner__content">
                <p class="product-banner__eyebrow">{{ product.eyebrow[page.lang] }}</p>
                <h2>{{ product.name }}</h2>
                <p class="product-banner__description">{{ product.description[page.lang] }}</p>
                <span class="product-banner__action">{{ product.cta[page.lang] }} <span aria-hidden="true">&rarr;</span></span>
            </div>
        </article>
        {% if product.page[page.lang] %}
    </a>
    {% endif %}
    {% endfor %}
    </div>
</section>
